<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D文物修复</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #F5F0E8;
      font-family: 'STKaiti', 'KaiTi', serif;
      touch-action: none;
    }

    #container {
      width: 100%; height: 100%; position: relative;
    }

    .header {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 20px;
      background: linear-gradient(180deg, rgba(245,240,232,0.95) 0%, rgba(245,240,232,0) 100%);
      z-index: 100;
      display: flex; justify-content: center; align-items: center;
    }

    .title {
      color: #5D4E37; font-size: 18px; font-weight: bold; letter-spacing: 4px;
    }

    .loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; z-index: 200;
    }

    .loading-spinner {
      width: 60px; height: 60px;
      border: 4px solid #C9A96E; border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    .loading-text { color: #5D4E37; font-size: 16px; letter-spacing: 2px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .controls-hint {
      position: absolute; bottom: 30px; left: 0; right: 0;
      text-align: center; z-index: 100; pointer-events: none;
    }

    .hint-text {
      display: inline-block;
      background: rgba(93, 78, 55, 0.85); color: #FFF9E6;
      padding: 12px 24px; border-radius: 30px;
      font-size: 14px; letter-spacing: 2px;
    }

    .progress-bar {
      position: absolute; bottom: 80px; left: 50%;
      transform: translateX(-50%);
      width: 200px; height: 6px;
      background: rgba(201, 169, 110, 0.3);
      border-radius: 3px; overflow: hidden; z-index: 100;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #C9A96E, #D4AF37);
      border-radius: 3px; width: 0%; transition: width 0.2s ease;
    }

    /* 右侧模式切换按钮 */
    .mode-buttons {
      position: absolute; top: 50%; right: 16px;
      transform: translateY(-50%); z-index: 100;
      display: flex; flex-direction: column; gap: 16px;
    }

    .mode-btn {
      width: 56px; height: 72px; border-radius: 12px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(139,115,85,0.35);
      border: 2px solid transparent;
      transition: all 0.25s ease;
      background: linear-gradient(135deg, #D4AF37 0%, #B8942E 100%);
    }

    .mode-btn .mode-icon { font-size: 22px; margin-bottom: 4px; color: #FFF9E6; }

    .mode-btn .mode-label {
      font-size: 11px; color: #FFF9E6; letter-spacing: 1px; font-weight: bold;
    }

    .mode-btn.inactive {
      background: rgba(255, 253, 248, 0.92); border-color: #C9A96E;
    }
    .mode-btn.inactive .mode-icon { color: #8B7355; }
    .mode-btn.inactive .mode-label { color: #8B7355; }

    .mode-btn:active { transform: scale(0.95); }

    /* 介绍光标 */
    .hotspot-marker {
      position: absolute; width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(201, 169, 110, 0.25);
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; z-index: 90; pointer-events: auto;
      animation: pulse 2s ease-in-out infinite;
    }

    .hotspot-marker::before {
      content: '';
      width: 12px; height: 12px; border-radius: 50%;
      background: #D4AF37;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.15); }
    }

    /* 介绍弹窗卡片 */
    .info-card-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; transition: background 0.3s ease;
    }

    .info-card-overlay.show {
      background: rgba(0, 0, 0, 0.5); pointer-events: auto;
    }

    .info-card {
      width: 82%; max-width: 340px;
      background: #FFFDF8; border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.25); overflow: hidden;
      transform: scale(0.85); opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .info-card-overlay.show .info-card {
      transform: scale(1); opacity: 1;
    }

    .info-card-header {
      background: linear-gradient(135deg, #5D4E37 0%, #8B7355 100%);
      padding: 18px 20px; position: relative;
    }

    .info-card-title {
      color: #FFF9E6; font-size: 17px; font-weight: bold;
      letter-spacing: 3px; text-align: center;
    }

    .info-card-corner {
      position: absolute; width: 14px; height: 14px;
      border-color: #C9A96E; border-style: solid;
    }

    .info-card-corner.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
    .info-card-corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
    .info-card-corner.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
    .info-card-corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

    .info-card-body {
      padding: 22px 20px; max-height: 280px; overflow-y: auto;
    }

    .info-card-text {
      font-size: 14px; color: #5D4E37; line-height: 26px;
      letter-spacing: 1px; text-align: justify; text-indent: 2em;
    }

    .info-card-footer {
      padding: 0 20px 18px; display: flex; justify-content: center;
    }

    .info-card-close {
      background: linear-gradient(135deg, #8B7355 0%, #5D4E37 100%);
      padding: 10px 48px; border-radius: 24px;
      box-shadow: 0 4px 12px rgba(93,78,55,0.3);
    }

    .info-card-close:active { transform: scale(0.95); }

    .info-card-close-text {
      color: #FFF9E6; font-size: 14px; font-weight: 500; letter-spacing: 3px;
    }

    .help-panel {
      position: absolute; top: 80px; right: 20px;
      background: rgba(255, 253, 248, 0.95);
      border-radius: 12px; padding: 16px;
      box-shadow: 0 4px 16px rgba(139,115,85,0.2);
      z-index: 100; max-width: 200px;
    }

    .help-title {
      color: #5D4E37; font-size: 14px; font-weight: bold;
      margin-bottom: 12px; text-align: center;
    }

    .help-item {
      color: #8B7355; font-size: 12px; margin-bottom: 8px;
      display: flex; align-items: center;
    }

    .help-icon { margin-right: 8px; }
  </style>
</head>

        {

        {
          name: '蛇首——兽头',

          text: '蛇首坐落于喷水池北岸，对应巳时喷水报时，是海晏堂经典的生肖水景造像构件。兽头造型灵动别致，线条温润柔和，雕刻纹路细腻考究。完美结合中式生肖文化寓意与西式立体雕塑工艺，本模型精准复原蛇首原貌，展现独特的古典造像美学。'

      ],
      // 9. 方外观
      '方外观': [
        {
          name: '方外观蓝色琉璃瓦屋顶',
          position: { x: 0, y: 1.0, z: 0.2 },
          text: '方外观蓝色琉璃瓦屋顶，是西洋楼经典的中西合璧顶部建筑结构。建筑整体为西式楼阁形制，顶部搭配中式皇家蓝色琉璃瓦，色调清雅庄重。中西建筑元素巧妙融合，极具辨识度，本模型完整还原屋顶形制与瓦面细节，再现皇家园林独特建筑风貌。'

      ],
      // 10. 黄花阵中心亭（黄花阵部分）
      '黄花阵中心亭（黄花阵部分）': [
        {
          name: '黄花阵欧式穹顶与亭顶装饰',
          position: { x: 0, y: 1.2, z: 0.2 },
          text: '黄花阵中心亭欧式穹顶与尖顶装饰，是整座迷宫建筑的制高点与视觉核心。穹顶圆润饱满，顶部尖饰精巧别致，采用纯正欧式园林亭台设计风格。造型轻盈灵动、独具异域风情，本模型精准还原穹顶结构与顶部装饰细节。'
        },
        {
          name: '黄花阵正面台阶',
          position: { x: 0, y: -0.3, z: 0.5 },
          text: '黄花阵中心亭正面台阶，是通往亭身的前置入户结构。多层石阶层级均匀、排布规整，对称式设计贴合皇家园林严谨的造景风格，兼顾通行功能与立面美观度。本模型完整复原台阶尺寸与层级细节，还原亭台完整建筑格局。'
        },
        {
          name: '黄花阵八角形亭身与拱门',
          position: { x: 0, y: 0.3, z: 0.3 },
          text: '黄花阵中心亭为独特的八角形亭身结构，搭配多处拱形门洞，是欧式迷宫核心建筑主体。八边形结构均衡对称，拱门通透雅致，整体造型精巧别致。融合西式园林设计理念，本模型精准还原亭身形制与拱门构造细节。'

    };

    // 根据模型名称获取当前模型的光标数据
    let hotspotsData = [];
    if (hotspotsConfig[artifactName]) {
      hotspotsData = hotspotsConfig[artifactName].map(function(item) {
        return {
          name: item.name,
          position: new THREE.Vector3(item.position.x, item.position.y, item.position.z),
          text: item.text
        };
      });
    }
    const hasHotspots = hotspotsData.length > 0;

    // ============ Three.js 变量 ============
    let scene, camera, renderer, controls, model;

    // 状态管理
    let currentMode = 'interact';
    let isIntroCardOpen = false;

    const initialCameraPosition = new THREE.Vector3(0, 1, 3);
    const initialTarget = new THREE.Vector3(0, 0, 0);

    const hotspotMeshes = [];
    let hotspotDOMElements = [];

    if (typeof THREE === 'undefined') {
      document.getElementById('loadingText').innerHTML = 'Three.js加载失败<br><br>请检查网络连接';
    }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xF5F0E8);
      scene.fog = new THREE.Fog(0xF5F0E8, 5, 20);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.copy(initialCameraPosition);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.getElementById('container').appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 10, 7);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight2.position.set(-5, -5, -5);
      scene.add(dirLight2);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enablePan = true;
      controls.panSpeed = 0.5;
      controls.rotateSpeed = 0.8;
      controls.zoomSpeed = 1.2;
      controls.minDistance = 0.5;
      controls.maxDistance = 10;
      controls.autoRotate = false;
      controls.autoRotateSpeed = 2;
      controls.maxPolarAngle = Math.PI * 0.9;
      controls.minPolarAngle = Math.PI * 0.1;

      const groundGeo = new THREE.CircleGeometry(3, 64);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0xE8E0D0, transparent: true, opacity: 0.8 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -1;
      ground.receiveShadow = true;
      scene.add(ground);

      loadModel();
      bindEvents();
      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function loadModel() {
      if (typeof THREE.GLTFLoader === 'undefined') {
        document.getElementById('loadingText').innerHTML = '模型加载器加载失败<br><br>请刷新重试';
        return;
      }

      const loader = new THREE.GLTFLoader();
      console.log('正在加载模型:', modelPath);
      document.getElementById('loadingText').textContent = '正在加载模型...';

      loader.load(
        modelPath,
        function(gltf) {
          model = gltf.scene;
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 2 / maxDim;
          model.scale.setScalar(scale);
          model.position.sub(center.multiplyScalar(scale));
          model.position.y = -0.5;

          model.traverse(function(child) {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });

          scene.add(model);

          // 只在有配置光标的模型上创建3D热点
          if (hasHotspots) {
            createHotspots();
          }

          document.getElementById('loading').style.display = 'none';
          document.getElementById('progressBar').style.display = 'none';
          document.getElementById('helpPanel').style.display = 'block';
          console.log('模型加载成功, 模型名:', artifactName, ' 光标数:', hotspotsData.length);
        },
        function(xhr) {
          var progress = (xhr.loaded / xhr.total * 100).toFixed(0);
          document.getElementById('progressFill').style.width = progress + '%';
          document.getElementById('loadingText').textContent = '加载中 ' + progress + '%';
          if (progress >= 100) {
            setTimeout(function() {
              document.getElementById('progressBar').style.display = 'none';
            }, 500);
          }
        },
        function(error) {
          console.error('模型加载失败:', error);
          document.getElementById('loadingText').innerHTML = '模型加载失败<br><br>请检查模型文件是否存在';
        }
      );
    }

    function createHotspots() {
      hotspotsData.forEach(function(data, index) {
        var geo = new THREE.SphereGeometry(0.06, 16, 16);
        var mat = new THREE.MeshBasicMaterial({ color: 0xD4AF37, transparent: true, opacity: 0.9 });
        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(data.position);
        mesh.userData = { hotspotIndex: index };
        mesh.visible = false;
        scene.add(mesh);
        hotspotMeshes.push(mesh);

        var ringGeo = new THREE.RingGeometry(0.08, 0.1, 32);
        var ringMat = new THREE.MeshBasicMaterial({
          color: 0xD4AF37, transparent: true, opacity: 0.4, side: THREE.DoubleSide
        });
        var ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.copy(data.position);
        ring.lookAt(camera.position);
        ring.visible = false;
        ring.userData = { isRing: true, parentIndex: index };
        scene.add(ring);
        hotspotMeshes.push(ring);
      });
    }

    function updateHotspots() {
      if (currentMode !== 'intro' || !hasHotspots) return;

      var container = document.getElementById('hotspotsContainer');
      container.innerHTML = '';
      hotspotDOMElements = [];

      hotspotsData.forEach(function(data, index) {
        var mesh = hotspotMeshes[index * 2];
        if (!mesh) return;
        mesh.visible = true;

        var ring = hotspotMeshes[index * 2 + 1];
        if (ring) { ring.visible = true; ring.lookAt(camera.position); }

        var vector = data.position.clone();
        vector.project(camera);

        var x = (vector.x * 0.5 + 0.5) * window.innerWidth;
        var y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;

        var marker = document.createElement('div');
        marker.className = 'hotspot-marker';
        marker.style.left = x + 'px';
        marker.style.top = y + 'px';
        marker.style.pointerEvents = 'auto';
        marker.dataset.index = index;
        marker.addEventListener('click', function(e) {
          e.stopPropagation();
          openInfoCard(parseInt(this.dataset.index));
        });
        container.appendChild(marker);
        hotspotDOMElements.push(marker);
      });
    }

    function hideHotspots() {
      hotspotMeshes.forEach(function(m) { m.visible = false; });
      document.getElementById('hotspotsContainer').innerHTML = '';
      hotspotDOMElements = [];
    }

    function openInfoCard(index) {
      var data = hotspotsData[index];
      if (!data) return;
      document.getElementById('infoCardTitle').textContent = data.name;
      document.getElementById('infoCardText').textContent = data.text;
      document.getElementById('infoCardOverlay').classList.add('show');
      isIntroCardOpen = true;
    }

    function closeInfoCard() {
      document.getElementById('infoCardOverlay').classList.remove('show');
      isIntroCardOpen = false;
    }

    function resetView() {
      camera.position.copy(initialCameraPosition);
      controls.target.copy(initialTarget);
      controls.update();
    }

    function setControlsEnabled(enabled) {
      controls.enabled = enabled;
      controls.enableRotate = enabled;
      controls.enableZoom = enabled;
      controls.enablePan = enabled;
    }

    function switchToIntroMode() {
      if (currentMode === 'intro') return;
      if (!hasHotspots) {
        // 该模型暂无介绍光标配置，给出提示
        alert('该模型暂无局部介绍');
        return;
      }
      currentMode = 'intro';
      resetView();
      setControlsEnabled(false);
      updateHotspots();
      document.getElementById('btnIntro').classList.remove('inactive');
      document.getElementById('btnInteract').classList.add('inactive');
      document.getElementById('hintText').textContent = '点击光标点查看介绍';
      console.log('切换到：查看介绍模式 (' + artifactName + ')');
    }

    function switchToInteractMode() {
      if (currentMode === 'interact') return;
      currentMode = 'interact';
      closeInfoCard();
      hideHotspots();
      resetView();
      setControlsEnabled(true);
      document.getElementById('btnIntro').classList.add('inactive');
      document.getElementById('btnInteract').classList.remove('inactive');
      document.getElementById('hintText').textContent = '拖拽旋转 · 双指缩放';
      console.log('切换到：交互模式');
    }

    function bindEvents() {
      document.getElementById('btnIntro').addEventListener('click', switchToIntroMode);
      document.getElementById('btnInteract').addEventListener('click', switchToInteractMode);
      document.getElementById('infoCardClose').addEventListener('click', closeInfoCard);
      document.getElementById('infoCardOverlay').addEventListener('click', closeInfoCard);
      document.querySelector('.info-card').addEventListener('click', function(e) {
        e.stopPropagation();
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (currentMode === 'intro') { updateHotspots(); }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (currentMode === 'intro' && hotspotDOMElements.length > 0) {
        hotspotsData.forEach(function(data, index) {
          var vector = data.position.clone();
          vector.project(camera);
          var x = (vector.x * 0.5 + 0.5) * window.innerWidth;
          var y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
          var marker = hotspotDOMElements[index];
          if (marker) {
            marker.style.left = x + 'px';
            marker.style.top = y + 'px';
            if (vector.z > 1 || x < -50 || x > window.innerWidth + 50 || y < -50 || y > window.innerHeight + 50) {
              marker.style.display = 'none';
            } else {
              marker.style.display = 'flex';
            }
          }
        });
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
